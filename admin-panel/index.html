<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HFT Trader — админка</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1d2330;--mut:#6b7385;--line:#e2e5ec;--acc:#2f6fed;--ok:#1a9b5b;--bad:#d64040;--warn:#c98a10}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b1f27;--fg:#e4e7ee;--mut:#8d95a8;--line:#2b313d;--acc:#5b8cff;--ok:#3cc47f;--bad:#ff6b6b;--warn:#e7b041}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
header h1{font-size:16px;margin:0 8px 0 0}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{background:none;border:1px solid transparent;color:var(--mut);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{color:var(--fg);border-color:var(--line);background:var(--bg)}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
button.b{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:6px 12px;border-radius:6px;cursor:pointer}
button.b:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.d{background:var(--bad);border-color:var(--bad);color:#fff}
.tbl{width:100%;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px}
td.n{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.field label{display:block;font-size:12px;color:var(--mut)}
.field input,.field select{width:100%}
.field small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:8px;border-radius:6px;margin:0;font-size:12px;max-height:300px;overflow:auto}
#toast{position:fixed;right:16px;bottom:16px;max-width:420px;padding:10px 14px;border-radius:8px;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 16px #0003;display:none;z-index:5}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>HFT Trader</h1>
  <span id="botState" class="pill">…</span>
  <nav id="tabs"></nav>
  <span class="grow"></span>
  <input id="base" placeholder="http://localhost:8080" style="width:200px">
  <input id="token" type="password" placeholder="ADMIN_TOKEN" style="width:160px">
  <label class="mut"><input id="auto" type="checkbox" checked> автообновление</label>
</header>
<main id="main"></main>
<div id="toast"></div>
<script>
const TABS = {overview:'Обзор', exchanges:'Биржи', params:'Параметры', market:'Рынок', order:'Ордера', discovery:'Подбор', settings:'Настройки'};
let tab = 'overview', timer = null;
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
try { $('#base').value = localStorage.getItem('hftBase') || 'http://localhost:8080'; $('#token').value = localStorage.getItem('hftToken') || ''; tab = localStorage.getItem('hftTab') || tab; } catch {}
$('#base').onchange = e => { try { localStorage.setItem('hftBase', e.target.value); } catch {} render(); };
$('#token').onchange = e => { try { localStorage.setItem('hftToken', e.target.value); } catch {} render(); };

async function api(path, params, method = 'GET') {
  const qs = params ? '?' + new URLSearchParams(Object.entries(params).filter(([, v]) => v !== '' && v != null)) : '';
  const h = {}; const t = $('#token').value; if (t) h['X-Admin-Token'] = t;
  const base = $('#base').value.trim().replace(/\/+$/, '') || 'http://localhost:8080';
  const r = await fetch(base + path + qs, {method, headers: h});
  const ct = r.headers.get('content-type') || '';
  const body = ct.includes('json') ? await r.json() : await r.text();
  if (!r.ok) throw new Error((body && body['сообщение']) || ('HTTP ' + r.status));
  return body;
}
const post = (p, q) => api(p, q, 'POST');
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; t.style.borderColor = bad ? 'var(--bad)' : 'var(--ok)'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 4000); }
async function act(fn, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  try { const r = await fn(); toast((r && (r['сообщение'] || r['внимание'])) || 'Готово'); render(); } catch (e) { toast(e.message, true); }
}
function table(cols, rows) {
  return `<div class="tbl"><table><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => typeof c === 'number' ? `<td class="n">${c}</td>` : `<td>${c ?? ''}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
const yn = (b, y = 'да', n = 'нет') => b ? `<span class="ok">${y}</span>` : `<span class="bad">${n}</span>`;

// кнопки вкладок создаются один раз: пересоздание между mousedown и mouseup теряло клик
$('#tabs').innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-t="${k}">${v}</button>`).join('');
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.t; try { localStorage.setItem('hftTab', tab); } catch {} render(); };
function drawTabs() { $('#tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === tab)); }

// перерисовки идут строго по очереди, чтобы медленный ответ старой вкладки не затёр новую
let queue = Promise.resolve();
function render() { queue = queue.then(doRender); return queue; }
async function doRender() {
  drawTabs();
  try {
    const cs = await api('/control/status');
    $('#botState').innerHTML = cs['запущен'] ? '<span class="ok">запущен</span>' : '<span class="mut">остановлен</span>';
    await VIEWS[tab](cs);
  } catch (e) { $('#main').innerHTML = `<div class="card bad">${esc(e.message)}</div>`; }
}
// не перерисовывать вкладки с формами, пока пользователь в них что-то вводит
function tick() { if ($('#auto').checked && !['params', 'settings', 'order', 'exchanges'].includes(tab) && !document.activeElement.matches('input,select')) render(); }

const VIEWS = {
  async overview(cs) {
    const st = cs['запущен'] ? await api('/status') : {};
    const stats = cs['запущен'] ? await api('/exchanges/request-stats').catch(() => ({})) : {};
    const sel = cs['выбрано'];
    const rows = Object.keys(sel).map(id => {
      const s = st[id] || {};
      return [`<b>${esc(id)}</b>`, esc(sel[id].join(', ')), st[id] ? yn(s['подключение']) : '<span class="mut">—</span>',
        yn(cs['торговля_включена'][id], 'вкл', 'выкл'), s['получено_сообщений'] ?? '', s['дневной_pnl'] ?? '',
        s['ордеров_принято'] != null ? `${s['ордеров_принято']} / ${s['ордеров_отклонено']}` : '',
        s['kill_switch'] ? '<span class="bad">сработал</span>' : '', esc(s['последний_отказ'] || ''),
        `<button class="b" data-a="ton" data-x="${id}">торг. вкл</button> <button class="b" data-a="toff" data-x="${id}">выкл</button> <button class="b d" data-a="panic" data-x="${id}">panic</button>`];
    });
    $('#main').innerHTML = `
      <div class="card"><h2>Управление</h2><div class="row">
        <button class="b p" id="start">Поднять соединения</button>
        <button class="b" id="stop">Остановить</button>
        <button class="b" id="tOn">Торговля: включить везде</button>
        <button class="b" id="tOff">Торговля: выключить везде</button>
        <button class="b d" id="panic">PANIC (отменить всё)</button>
        <span class="grow"></span>
        <label class="mut"><input type="checkbox" id="asE"> автостарт</label>
        <label class="mut"><input type="checkbox" id="asT"> + торговля</label>
        <button class="b" id="asSave">Сохранить автостарт</button>
      </div></div>
      <div class="card"><h2>Выбранные биржи</h2>${rows.length ? table(['Биржа', 'Символы', 'Связь', 'Торговля', 'Сообщ.', 'PnL день', 'Ордера ок/отказ', 'Kill', 'Последний отказ', ''], rows) : '<p class="mut">Ничего не выбрано — вкладка «Биржи».</p>'}</div>
      ${Object.keys(stats).length ? `<div class="card"><h2>Запросы к биржам</h2>${table(['Биржа', 'Запросов', 'Ошибок', '429', 'Средн. мс', 'Макс. мс', 'Пауза мс', 'Последняя ошибка'],
        Object.entries(stats).map(([id, s]) => [esc(id), s.requests, s.errors, s.rateLimited, +(s.avgLatencyMs || 0).toFixed(1), +(s.maxLatencyMs || 0).toFixed(1), s.blockedForMs, esc(s.lastError || '')]))}</div>` : ''}`;
    $('#start').onclick = () => act(() => post('/control/start'));
    $('#stop').onclick = () => act(() => post('/control/stop'), 'Разорвать все соединения?');
    $('#tOn').onclick = () => act(() => post('/trading/start', {exchange: 'all'}), 'Включить реальную отправку ордеров на всех биржах?');
    $('#tOff').onclick = () => act(() => post('/trading/stop', {exchange: 'all'}));
    $('#panic').onclick = () => act(() => post('/trading/panic', {exchange: 'all'}), 'Остановить торговлю и отменить ВСЕ ордера?');
    $('#asSave').onclick = () => act(() => post('/control/autostart', {enabled: $('#asE').checked, trade: $('#asT').checked}));
    $('#main').querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
      const x = b.dataset.x, a = b.dataset.a;
      if (a === 'ton') act(() => post('/trading/start', {exchange: x}), `Включить торговлю на ${x}?`);
      if (a === 'toff') act(() => post('/trading/stop', {exchange: x}));
      if (a === 'panic') act(() => post('/trading/panic', {exchange: x}), `PANIC на ${x}: отменить все ордера?`);
    });
  },

  async exchanges(cs) {
    const cat = (await api('/exchanges/catalog')).exchanges;
    const sel = cs['выбрано'];
    const rows = cat.map(e => [
      `<b>${esc(e.title)}</b><div class="mut">${esc(e.id)}</div>`, esc(e.kind), `<span class="pill">${esc(e.adapter)}</span>`,
      `${e.makerFeePct}% / ${e.takerFeePct}%`, e.maxRequestsPerSec, `<span class="mut">${esc(e.notes)}</span>`,
      !e.selectable ? '<span class="mut">недоступна</span>' : sel[e.id]
        ? `<div>${sel[e.id].map(s => `<span class="pill">${esc(s)} <a href="#" data-rm="${e.id}" data-s="${s}">×</a></span>`).join(' ')}</div>
           <div class="row" style="margin-top:6px"><input placeholder="добавить символ" data-addin="${e.id}" size="10"><button class="b" data-add="${e.id}">+</button><button class="b" data-des="${e.id}">убрать биржу</button></div>`
        : `<div class="row"><input placeholder="${esc(e.symbolHint)}" data-selin="${e.id}" size="16"><button class="b p" data-sel="${e.id}">выбрать</button></div>`]);
    $('#main').innerHTML = `<div class="card"><h2>Каталог бирж</h2>${table(['Биржа', 'Тип', 'Адаптер', 'Maker / taker', 'Req/с', 'Заметки', 'Выбор'], rows)}
      <p class="mut">Символы через запятую. Изменения выбора применяются после «Остановить» → «Поднять соединения».</p></div>`;
    const m = $('#main');
    m.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => act(() => post('/control/select', {exchange: b.dataset.sel, symbols: m.querySelector(`[data-selin="${b.dataset.sel}"]`).value})));
    m.querySelectorAll('[data-des]').forEach(b => b.onclick = () => act(() => post('/control/deselect', {exchange: b.dataset.des}), `Убрать ${b.dataset.des} из выбора?`));
    m.querySelectorAll('[data-add]').forEach(b => b.onclick = () => act(() => post('/control/symbols', {exchange: b.dataset.add, add: m.querySelector(`[data-addin="${b.dataset.add}"]`).value.toUpperCase()})));
    m.querySelectorAll('[data-rm]').forEach(a => a.onclick = ev => { ev.preventDefault(); act(() => post('/control/symbols', {exchange: a.dataset.rm, remove: a.dataset.s})); });
  },

  async params(cs) {
    const ids = Object.keys(cs['выбрано']);
    if (!ids.length) { $('#main').innerHTML = '<div class="card mut">Сначала выберите биржу на вкладке «Биржи».</div>'; return; }
    const cur = paramsEx && ids.includes(paramsEx) ? paramsEx : ids[0];
    const [schema, p] = await Promise.all([api('/exchange/params/schema'), api('/exchange/params', {exchange: cur})]);
    $('#main').innerHTML = `<div class="card"><div class="row"><h2 class="grow" style="margin:0">Параметры биржи</h2>
      <select id="pex">${ids.map(i => `<option ${i === cur ? 'selected' : ''}>${esc(i)}</option>`).join('')}</select>
      <span class="mut">testnet: ${p['testnet_доступен'] ? 'есть' : 'нет'}</span><button class="b p" id="psave">Сохранить изменённые</button></div>
      <div class="grid" style="margin-top:12px">${form(schema, p['параметры'])}</div></div>`;
    $('#pex').onchange = e => { paramsEx = e.target.value; render(); };
    $('#psave').onclick = () => act(() => post('/exchange/params', {exchange: cur, ...changed()}));
  },

  async settings() {
    const s = await api('/settings');
    $('#main').innerHTML = `<div class="card"><div class="row"><h2 class="grow" style="margin:0">Настройки процесса</h2><button class="b p" id="gsave">Сохранить изменённые</button></div>
      <div class="grid" style="margin-top:12px">${form(s['описание'], s['настройки'])}</div></div>`;
    $('#gsave').onclick = () => act(() => post('/settings', changed()));
  },

  async market(cs) {
    if (!cs['запущен']) { $('#main').innerHTML = '<div class="card mut">Бот не запущен — нажмите «Поднять соединения» на вкладке «Обзор».</div>'; return; }
    const st = await api('/status'); const ids = Object.keys(st).filter(k => k !== 'бот_запущен');
    const cur = marketEx && ids.includes(marketEx) ? marketEx : ids[0];
    if (!cur) { $('#main').innerHTML = '<div class="card mut">Нет активных бирж.</div>'; return; }
    const [mk, bal, str] = await Promise.all([api('/market', {exchange: cur}), api('/balances', {exchange: cur}).catch(e => ({err: e.message})), api('/strategies', {exchange: cur}).catch(e => ({err: e.message}))]);
    $('#main').innerHTML = `<div class="card"><div class="row"><h2 class="grow" style="margin:0">Рынок</h2>
      <select id="mex">${ids.map(i => `<option ${i === cur ? 'selected' : ''}>${esc(i)}</option>`).join('')}</select></div>
      ${table(['Символ', 'Бид', 'Аск', 'Спред %', 'Дисбаланс', 'Возраст мс', 'Последняя', 'Тиков', 'z-score', 'Изм. %'],
        Object.entries(mk).map(([s, v]) => [`<b>${esc(s)}</b>`, v['лучший_бид'] ?? `<span class="warn">${esc(v['состояние'] || '')}</span>`, v['лучший_аск'], v['спред_проц'], v['дисбаланс'], v['возраст_мс'], v['последняя_цена'], v['тиков'], v['z_score'], v['изменение_проц']]))}</div>
      <div class="card"><h2>Балансы</h2>${bal.err ? `<p class="bad">${esc(bal.err)}</p>` : table(['Актив', 'Свободно'], Object.entries(bal['свободно']).map(([a, v]) => [esc(a), v]))}</div>
      <div class="card"><h2>Стратегии</h2><pre>${esc(JSON.stringify(str.err || str['стратегии'], null, 2))}</pre></div>`;
    $('#mex').onchange = e => { marketEx = e.target.value; render(); };
  },

  async order(cs) {
    if (!cs['запущен']) { $('#main').innerHTML = '<div class="card mut">Ручные ордера доступны после «Поднять соединения».</div>'; return; }
    const st = await api('/status'); const ids = Object.keys(st).filter(k => k !== 'бот_запущен');
    const opt = ids.map(i => `<option>${esc(i)}</option>`).join('');
    $('#main').innerHTML = `<div class="card"><h2>Ручной ордер</h2><div class="grid">
      <div class="field"><label>Биржа</label><select id="oex">${opt}</select></div>
      <div class="field"><label>Символ</label><input id="osym" placeholder="BTCUSDT"></div>
      <div class="field"><label>Сторона</label><select id="oside"><option>BUY</option><option>SELL</option></select></div>
      <div class="field"><label>Тип</label><select id="otype"><option>MARKET</option><option>LIMIT</option></select></div>
      <div class="field"><label>Объём</label><select id="omode"><option value="qty">количество</option><option value="portion">доля баланса (только MARKET)</option><option value="all">весь баланс</option></select></div>
      <div class="field"><label>Количество / доля (0..1)</label><input id="oval" type="number" step="any"></div>
      <div class="field"><label>Цена (LIMIT)</label><input id="oprice" type="number" step="any"></div>
      </div><div class="row" style="margin-top:12px"><button class="b p" id="osend">Отправить</button><span class="grow"></span>
      <button class="b d" id="ocancel">Отменить все ордера символа</button></div><pre id="ores" class="hidden" style="margin-top:10px"></pre></div>`;
    $('#osend').onclick = async () => {
      const mode = $('#omode').value, v = $('#oval').value;
      const q = {exchange: $('#oex').value, symbol: $('#osym').value.toUpperCase(), side: $('#oside').value, type: $('#otype').value,
        qty: mode === 'qty' ? v : '', portion: mode === 'portion' ? v : '', all: mode === 'all' ? 'true' : '', price: $('#oprice').value};
      if (!confirm(`${q.type} ${q.side} ${q.symbol} на ${q.exchange}?`)) return;
      try { const r = await post('/order', q); $('#ores').textContent = JSON.stringify(r, null, 2); $('#ores').classList.remove('hidden'); toast('Ордер: ' + r['статус']); }
      catch (e) { toast(e.message, true); }
    };
    $('#ocancel').onclick = () => act(() => post('/cancel-all', {exchange: $('#oex').value, symbol: $('#osym').value.toUpperCase()}), 'Отменить все ордера символа?');
  },

  async discovery() {
    const d = await api('/discovery');
    if (d['результат']) { $('#main').innerHTML = `<div class="card mut">${esc(d['сообщение'])}</div>`; return; }
    const ex = d.exchanges || {};
    $('#main').innerHTML = `<div class="card"><div class="row"><h2 class="grow" style="margin:0">Подбор тикеров</h2>
      <span class="mut">${d.updatedAt ? 'обновлено ' + new Date(d.updatedAt).toLocaleString() + ', ' + d.durationMs + ' мс' : 'ещё не считалось'}${d.running ? ' · <span class="warn">идёт пересчёт</span>' : ''}</span>
      <button class="b" id="dref">Пересчитать</button></div>
      ${table(['Биржа', 'Ответ', 'Тикеров', 'мс', 'Ошибка'], Object.entries(ex).map(([id, s]) => [esc(id), yn(s.ok, 'ок', 'ошибка'), s.tickers ?? '', s.waitMs, esc(s.error || '')]))}</div>
      ${(d.strategies || []).map(s => `<div class="card"><h2>${esc(s.title)} <span class="pill">${s.suitable ?? 0} подходят</span> ${s.executable ? '' : '<span class="pill warn">только анализ</span>'}</h2>
        <p class="mut">${esc(s.description)}</p>${s.error ? `<p class="bad">${esc(s.error)}</p>` : ''}
        ${table(['Биржа', 'Символ', 'Вердикт', 'Оценка', 'Причины', ''], (s.candidates || []).slice(0, 50).map(c => [esc(c.exchange), `<b>${esc(c.symbol)}</b>`, c.suitable ? `<span class="ok">${esc(c.verdict)}</span>` : esc(c.verdict), +(+c.score).toFixed(3), esc((c.reasons || []).join('; ')),
          c.suitable ? `<button class="b" data-ex="${esc(c.exchange)}" data-s="${esc(c.symbol)}">в выбор</button>` : '']))}</div>`).join('')}`;
    $('#dref').onclick = () => act(() => post('/discovery/refresh'));
    $('#main').querySelectorAll('[data-ex]').forEach(b => b.onclick = async () => {
      const cs = await api('/control/status');
      if (cs['выбрано'][b.dataset.ex]) act(() => post('/control/symbols', {exchange: b.dataset.ex, add: b.dataset.s}));
      else act(() => post('/control/select', {exchange: b.dataset.ex, symbols: b.dataset.s}));
    });
  },
};
let paramsEx = null, marketEx = null;

// форма из схемы параметров: флажки — select, остальное — input; изменённые поля помечаются
function form(schema, values) {
  return Object.entries(schema).map(([k, s]) => {
    const v = values?.[k] ?? s.default, isFlag = s.default === 'true' || s.default === 'false';
    const range = s.min != null ? `${s.min} … ${s.max}` : s.format ? `формат ${s.format}` : '';
    const input = isFlag
      ? `<select data-k="${k}" data-o="${v}"><option ${String(v) === 'true' ? 'selected' : ''}>true</option><option ${String(v) === 'false' ? 'selected' : ''}>false</option></select>`
      : `<input data-k="${k}" data-o="${esc(v)}" value="${esc(v)}">`;
    return `<div class="field"><label>${esc(k)}${s.restart ? ' <span class="warn">⟳</span>' : ''}</label>${input}<small>${esc(s.help)}${range ? ' · ' + esc(range) : ''} · по умолч. ${esc(s.default)}</small></div>`;
  }).join('');
}
function changed() {
  const out = {};
  $('#main').querySelectorAll('[data-k]').forEach(el => { if (String(el.value) !== String(el.dataset.o)) out[el.dataset.k] = el.value; });
  if (!Object.keys(out).length) throw new Error('Ничего не изменено');
  return out;
}

render();
timer = setInterval(tick, 3000);
</script>
</body>
</html>
